.ex{grid-template-columns:36px minmax(0,1fr) auto}.check{appearance:auto;width:24px;height:24px;accent-color:var(--accent);cursor:pointer;margin:0}.check:focus-visible{outline:3px solid #4fb6a6;outline-offset:4px}.ex.done{border-color:#406052;background:#182621}.ex.done .name{color:#a4c4b5}.progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}.progress-row input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:9px;border-radius:9px;min-height:44px;min-width:0}#progress{color:var(--accent);font-variant-numeric:tabular-nums}#save-error{color:#f5a68d;font-size:13px}@media(max-width:420px){.ex{grid-template-columns:28px minmax(0,1fr) auto;gap:8px;padding:12px}.meta{flex-wrap:wrap;gap:6px 10px}}

 "Chèo máy khuỷu mở vừa — vai sau", "sets": 2, "reps": "12–15", "en": "seated row rear delt"}, {"name": "Cuốn tay trước trên ghế Preacher", "sets": 2, "reps": "10–15", "en": "dumbbell preacher curl"}]}, {"id": 303, "short": "Chân", "title": "PPL · Chân + Bụng", "exercises": [{"name": "Đẩy đùi Leg Press", "sets": 3, "reps": "8–12", "en": "leg press machine"}, {"name": "Gập gối trượt gót — biên độ ngắn", "sets": 3, "reps": "6–12", "en": "slider hamstring curl regression"}, {"name": "Glute Bridge trên sàn", "sets": 3, "reps": "10–15", "en": "floor glute bridge"}, {"name": "Duỗi gối máy Leg Extension", "sets": 2, "reps": "10–15", "en": "leg extension machine"}, {"name": "Nhón bắp chân đứng, có điểm vịn", "sets": 3, "reps": "12–20", "en": "standing calf raise supported"}, {"name": "Gập bụng máy Abdominal Crunch", "sets": 3, "reps": "10–15", "en": "abdominal crunch machine proper form"}], "revision": "abs1"}]};
const LABELS={gym:'Gym · 4 buổi',ppl:'Đẩy / Kéo / Chân',home:'Ở nhà'};
let mode='gym',selected=DATA.gym[0].id;
const $=id=>document.getElementById(id);
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
$('date').value=localDate();
let memory={};
function storageKey(){const day=DATA[mode].find(d=>d.id===selected);return `sotap:plan60v2:checks:${mode}:${$('date').value}:${selected}${day.revision?':'+day.revision:''}`;}
function readChecks(key){
 try{const raw=localStorage.getItem(key);const parsed=raw?JSON.parse(raw):{};if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){memory[key]=parsed;return parsed;}}
 catch(e){$('save-error').hidden=false;}
 return memory[key]||{};
}
function writeChecks(key,checks){memory[key]=checks;try{localStorage.setItem(key,JSON.stringify(checks));}catch(e){$('save-error').hidden=false;}}
$('date').addEventListener('change',()=>{if(!$('date').value)$('date').value=localDate();render();});
function button(label,active,action){const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(active));b.addEventListener('click',action);return b;}
function render(){
 $('programs').replaceChildren(...Object.keys(LABELS).map(key=>button(LABELS[key],mode===key,()=>{mode=key;selected=DATA[key][0].id;render();})));
 $('days').replaceChildren(...DATA[mode].map(day=>button(day.short,selected===day.id,()=>{selected=day.id;render();})));
 const day=DATA[mode].find(day=>day.id===selected);
 $('title').textContent=day.title;
 const key=storageKey(), checks=readChecks(key);
 const updateProgress=()=>{$('progress').textContent=`${day.exercises.filter((_,i)=>checks[i]===true).length}/${day.exercises.length} ✓`;};
 updateProgress();
 $('exercises').replaceChildren(...day.exercises.map((ex,index)=>{
  const row=document.createElement('article');row.className='ex'+(checks[index]===true?' done':'');
  const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=checks[index]===true;check.setAttribute('aria-label','Đã tập: '+ex.name);
  check.addEventListener('change',()=>{checks[index]=check.checked;row.className='ex'+(check.checked?' done':'');writeChecks(key,checks);updateProgress();});
  const body=document.createElement('div');const name=document.createElement('h3');name.className='name';name.textContent=ex.name;
  const meta=document.createElement('div');meta.className='meta';
  const sets=document.createElement('span');const setNumber=document.createElement('b');setNumber.textContent=ex.sets;sets.append(setNumber,' set');
  const reps=document.createElement('span');const repNumber=document.createElement('b');repNumber.textContent=ex.reps;reps.append(repNumber,ex.reps.includes('giây')?'':' rep');
  meta.append(sets,reps);body.append(name,meta);
  const video=document.createElement('a');video.textContent='▶ Video';video.href='https://www.youtube.com/results?search_query='+encodeURIComponent(ex.en+' exercise tutorial');video.target='_blank';video.rel='noopener noreferrer';video.setAttribute('aria-label','Video hướng dẫn: '+ex.name);
  row.append(check,body,video);return row;
 }));
}
render();
